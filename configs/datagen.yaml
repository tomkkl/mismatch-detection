# Dataset generation. Run: agentlint data build configs/datagen.yaml --tag pilot --n-honest 40
generator:
  model: opus             # via the claude CLI, on plan usage (not the paid API)
  effort: medium          # honest tool generation
  mutate_effort: medium   # code injection
  rewrite_effort: low     # description rewrites (twin, weaken)
cache_dir: data/generated/llm_cache   # shared by all tags; reruns resume from here
out_dir: data/generated
split_dir: data/splits
workers: 3                # parallel CLI calls
seed: 566

n_honest: 800
tools_per_call: 4
p_second_effect: 0.6      # share of tools that declare two effects (needed for weakening)
injections_per_tool: 1
max_added_lines: 15
max_changed_lines: 2
twin_length_ratio: [0.6, 1.8]     # twin description length / original
weaken_length_ratio: [0.6, 1.8]   # weakened description length / original
match_length_tol: 0.15            # mismatch description within ±15% of its twin's length
fractions: [0.8, 0.1, 0.1]

domains:
  - online store orders
  - billing and invoicing
  - HR and payroll
  - customer support tickets
  - CRM contacts and deals
  - cloud object storage
  - local file management
  - application logs
  - CI/CD pipelines
  - database administration
  - email marketing campaigns
  - calendar and scheduling
  - warehouse inventory
  - clinic appointments
  - online courses (LMS)
  - real estate listings
  - travel booking
  - restaurant reservations
  - smart home devices
  - social media management
  - blog and CMS content
  - code repository management
  - analytics reports
  - bank accounts
  - crypto wallets
  - insurance claims
  - legal documents
  - project tasks and sprints
  - team chat workspace
  - user account management
  - backups and archiving
  - ML experiment tracking
  - photo and video library
  - notes and knowledge base
  - shipping and logistics
  - subscriptions and plans
  - event ticketing
  - fitness tracking
  - recruiting and applicants
  - feature flags and config
  - DNS and domains
  - Kubernetes cluster operations